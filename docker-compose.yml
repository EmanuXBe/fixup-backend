services:
  postgres:
    image: postgres:16-alpine
    container_name: fixup_postgres_dev
    environment:
      POSTGRES_USER: fixup
      POSTGRES_PASSWORD: fixup_dev
      POSTGRES_DB: fixup_dev
    ports:
      - "5432:5432"
    volumes:
      - fixup_postgres_data:/var/lib/postgresql/data

volumes:
  fixup_postgres_data:
